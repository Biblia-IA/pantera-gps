<!doctype html>
<html lang="pt-BR" data-tema="escuro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0D0F12">
<title>Pantera GPS</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icone.svg">
<link rel="apple-touch-icon" href="icone.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Michroma&family=Geist:wght@300;400;500&display=swap">
<style>
/* Identidade Balestra Corporation: grafite e prata, o cromo como único brilho, sem cor de destaque.
   Michroma em maiúsculas espaçadas nos títulos e números; Geist 300/400 no texto. */
:root{
  --fundo:#0D0F12;--assoalho:#171B20;--placa:rgba(18,21,26,.95);--linha:#232A31;--linha2:#39434D;
  --tx:#DFE5EB;--prata:#E9EFF5;--aco:#8794A2;--mut:#7F8A96;--fraco:#5D6975;
  --cromo:linear-gradient(180deg,#fff 0,#d3dbe4 22%,#7a8795 44%,#2f3944 50%,#a4b4c4 55%,#eef3f8 78%,#8794a2);
  --botao:linear-gradient(180deg,#f7f9fb,#d6dde5 48%,#aab6c2 52%,#e6ebf0);--botaoTx:#0D0F12;
  --sombra:0 18px 40px rgba(0,0,0,.55);--grade:rgba(255,255,255,.035);
  --curva:cubic-bezier(.22,1,.36,1);color-scheme:dark}
[data-tema=claro]{
  --fundo:#EEF1F4;--assoalho:#E2E7EC;--placa:rgba(246,248,250,.96);--linha:#D6DCE2;--linha2:#B9C3CD;
  --tx:#1A1F25;--prata:#1A1F25;--aco:#5D6975;--mut:#6B7580;--fraco:#9AA6B2;
  --cromo:linear-gradient(180deg,#6c7886 0,#2a323b 44%,#0f1317 50%,#4b5662 58%,#78858f 80%,#2a323b);
  --botao:linear-gradient(180deg,#3a444e,#1a1f25 48%,#0d0f12 52%,#2a323b);--botaoTx:#E9EFF5;
  --sombra:0 14px 34px rgba(26,31,37,.16);--grade:rgba(26,31,37,.04);color-scheme:light}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--fundo);color:var(--tx);font:300 15px/1.45 Geist,-apple-system,system-ui,sans-serif;-webkit-font-smoothing:antialiased;transition:background .4s}
.so-claro{display:none}[data-tema=claro] .so-claro{display:block}[data-tema=claro] .so-escuro{display:none}
canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none}
button,input{font:inherit;color:inherit;border:0;background:none;-webkit-user-select:none;user-select:none}
button{cursor:pointer}
svg.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:square;stroke-linejoin:miter}
.disp{font-family:Michroma,Geist,sans-serif;font-weight:400;text-transform:uppercase;letter-spacing:.14em}
.cromo{background:var(--cromo);-webkit-background-clip:text;background-clip:text;color:transparent}
.placa{background:var(--placa);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border:1px solid var(--linha);box-shadow:var(--sombra)}

/* topo */
#topo{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top) + 10px) 12px 0;display:flex;flex-direction:column;gap:8px;transition:opacity .35s,transform .45s var(--curva)}
.marca{display:flex;align-items:center;gap:9px;height:20px}
.marca svg{width:14px;height:18px}
.marca b{font:400 11px Michroma,sans-serif;letter-spacing:.32em}
.marca span{font:400 9px Geist,sans-serif;letter-spacing:.3em;color:var(--mut);margin-left:auto}
.busca{display:flex;align-items:center;gap:10px;height:46px;padding:0 14px;border-radius:12px}
.busca svg{color:var(--aco);flex:none}
#busca{flex:1;min-width:0;height:100%;outline:0;font-size:16px;font-weight:300;-webkit-user-select:text;user-select:text}
#busca::placeholder{color:var(--mut)}
#achados{border-radius:12px;max-height:46vh;overflow:auto}
#achados:empty{display:none}
#achados button{display:block;width:100%;text-align:left;padding:11px 14px;border-bottom:1px solid var(--linha)}
#achados button:last-child{border:0}
#achados small{display:block;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--mut);margin-top:2px}
#chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:6px}
#chips::-webkit-scrollbar{display:none}
#chips button{flex:none;height:32px;padding:0 12px;border-radius:8px;font:400 9px Michroma,sans-serif;letter-spacing:.16em;text-transform:uppercase;white-space:nowrap;display:flex;align-items:center;gap:7px;transition:transform .2s var(--curva)}
#chips button:active{transform:scale(.95)}
#chips button i{width:5px;height:5px;transform:rotate(45deg);background:var(--aco)}
#chips button.falta{color:var(--mut);border-style:dashed}
#chips button.falta i{background:none;border:1px solid var(--mut)}

/* trilho lateral */
#trilho{position:fixed;right:12px;top:calc(env(safe-area-inset-top) + 134px);z-index:3;display:flex;flex-direction:column;border-radius:12px;overflow:hidden}
#trilho button{width:46px;height:46px;display:grid;place-items:center;color:var(--tx);transition:background .2s}
#trilho button:active{background:var(--linha)}
#trilho button+button{border-top:1px solid var(--linha)}
#trilho button.ativo{color:var(--prata);background:var(--linha)}
#bNorte svg{transition:transform .3s var(--curva)}
body.nav #bTema{display:none}

/* folha de baixo */
#folha{position:fixed;left:8px;right:8px;bottom:calc(env(safe-area-inset-bottom) + 8px);border-radius:18px;padding:6px 16px 16px;max-height:44vh;z-index:2;overflow:auto;background-image:linear-gradient(var(--grade) 1px,transparent 1px),linear-gradient(90deg,var(--grade) 1px,transparent 1px);background-size:32px 32px}
#folha:empty{display:none}
#folha.entra{animation:subir .5s var(--curva)}
@keyframes subir{from{transform:translateY(28px);opacity:0}}
.alca{display:block;width:100%;height:22px;position:relative}
.alca::after{content:"";position:absolute;left:50%;top:8px;width:34px;height:3px;margin-left:-17px;border-radius:2px;background:var(--linha2)}
#folha.mini>:not(.alca):not(.tit){display:none}
.tit{font:400 13px/1.5 Michroma,sans-serif;letter-spacing:.12em;text-transform:uppercase;display:block;padding-top:2px}
.sub{color:var(--mut);font-size:14px;margin-top:4px}
.num{display:grid;grid-template-columns:repeat(3,1fr);margin:14px 0 6px;border-top:1px solid var(--linha);border-bottom:1px solid var(--linha)}
.num div{padding:10px 0}.num div+div{border-left:1px solid var(--linha);padding-left:12px}
.num b{display:block;font:400 17px Michroma,sans-serif;letter-spacing:.04em;font-variant-numeric:tabular-nums}
.num span{font-size:9px;letter-spacing:.22em;text-transform:uppercase;color:var(--mut)}
.aviso{display:flex;gap:10px;align-items:flex-start;padding:8px 0;font-size:13.5px;border-bottom:1px solid var(--linha)}
.aviso svg{flex:none;width:15px;height:15px;margin-top:2px;color:var(--aco)}
.aviso.alerta{color:var(--prata);font-weight:400}.aviso.alerta svg{color:var(--prata)}
.legenda{display:flex;gap:16px;flex-wrap:wrap;padding:9px 0 2px;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--mut)}
.legenda i{display:inline-block;width:22px;height:0;border-top:3px solid var(--aco);vertical-align:middle;margin-right:7px}
.legenda i.tr{border-top-style:dashed}.legenda i.po{border-top-style:dotted}
.acoes{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:14px}
.acoes button{height:44px;border-radius:9px;border:1px solid var(--linha2);font:400 9.5px Michroma,sans-serif;letter-spacing:.14em;text-transform:uppercase;transition:transform .2s var(--curva)}
.acoes button:active{transform:scale(.97)}
.acoes button.pri{grid-column:1/-1;border:0;background:var(--botao);color:var(--botaoTx);box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 6px 18px rgba(0,0,0,.35)}
.acoes button.ativo{border-color:var(--prata);color:var(--prata)}
.campo{width:100%;height:46px;margin-top:12px;padding:0 14px;border-radius:9px;border:1px solid var(--linha2);font-size:16px;outline:0;-webkit-user-select:text;user-select:text}

/* manobra durante a navegação */
#manobra{position:fixed;left:8px;right:8px;top:calc(env(safe-area-inset-top) + 8px);border-radius:18px;padding:14px 16px;display:none;align-items:center;gap:14px}
#manobra .seta{width:52px;height:52px;flex:none;border-radius:12px;display:grid;place-items:center;background:var(--botao);color:var(--botaoTx)}
#manobra .seta svg{width:30px;height:30px;stroke-width:2}
#manobra b{display:block;font:400 22px Michroma,sans-serif;letter-spacing:.04em}
#manobra span{display:block;font-size:14px;color:var(--mut);margin-top:2px}
#manobra.aviso-fora .seta{background:none;border:1px solid var(--prata);color:var(--prata)}
body.nav #topo{opacity:0;pointer-events:none;transform:translateY(-16px)}
body.nav #manobra{display:flex;animation:descer .45s var(--curva)}
@keyframes descer{from{transform:translateY(-20px);opacity:0}}

/* GPS */
#gps{position:fixed;left:12px;bottom:calc(env(safe-area-inset-bottom) + 14px);height:28px;padding:0 11px;border-radius:7px;display:flex;align-items:center;gap:7px;font:400 8.5px Michroma,sans-serif;letter-spacing:.16em}
#gps[hidden]{display:none}
#gps i{width:6px;height:6px;transform:rotate(45deg);background:var(--prata)}
#gps.ruim i{background:none;border:1px solid var(--prata);animation:pisca 1.2s infinite}
@keyframes pisca{50%{opacity:.2}}
body.nav #gps{bottom:auto;top:calc(env(safe-area-inset-top) + 104px)}

/* cadeado */
#cadeado{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:32px;
  background:linear-gradient(var(--grade) 1px,transparent 1px) 0 0/48px 48px,linear-gradient(90deg,var(--grade) 1px,transparent 1px) 0 0/48px 48px,radial-gradient(ellipse at 50% 30%,#27303a,#0e1115 55%,#0b0d10);transition:opacity .4s,transform .4s}
[data-tema=claro] #cadeado{background:linear-gradient(var(--grade) 1px,transparent 1px) 0 0/48px 48px,linear-gradient(90deg,var(--grade) 1px,transparent 1px) 0 0/48px 48px,radial-gradient(ellipse at 50% 30%,#fff,#eef1f4 60%,#dfe5eb)}
#cadeado.sai{opacity:0;transform:scale(1.03)}
#cadeado .simb{width:58px;height:72px}
#cadeado .nome{text-align:center}
#cadeado .nome b{display:block;font:400 18px Michroma,sans-serif;letter-spacing:.3em}
#cadeado .nome span{font-size:9px;letter-spacing:.4em;color:var(--mut);text-transform:uppercase}
#cadeado .pontos{display:flex;gap:16px;height:12px}
#cadeado .pontos i{width:9px;height:9px;transform:rotate(45deg);border:1px solid var(--aco);transition:background .15s,transform .25s var(--curva)}
#cadeado .pontos i.on{background:var(--prata);border-color:var(--prata);transform:rotate(45deg) scale(1.15)}
#cadeado .tecl{display:grid;grid-template-columns:repeat(3,70px);gap:14px 22px}
#cadeado .tecl button{height:70px;border-radius:50%;border:1px solid var(--linha2);font:400 20px Michroma,sans-serif;transition:background .15s,transform .15s}
#cadeado .tecl button:active{background:var(--linha);transform:scale(.94)}
#cadeado .tecl button.sem{visibility:hidden}
#cadeado .tecl button.apaga{border:0}
#cadeado p{min-height:20px;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--mut)}
</style>
</head>
<body>
<canvas id="c"></canvas>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="gCromo" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff"/><stop offset=".35" stop-color="#D9DEE4"/><stop offset=".55" stop-color="#8E98A3"/><stop offset=".75" stop-color="#E6E9ED"/><stop offset="1" stop-color="#A7B0BA"/></linearGradient>
    <linearGradient id="gAco" x1="1" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#C3CAD2"/><stop offset=".5" stop-color="#5E6874"/><stop offset="1" stop-color="#8D97A2"/></linearGradient>
    <linearGradient id="gCromoD" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6C7886"/><stop offset=".44" stop-color="#2A323B"/><stop offset=".5" stop-color="#0F1317"/><stop offset=".6" stop-color="#4B5662"/><stop offset="1" stop-color="#2A323B"/></linearGradient>
    <linearGradient id="gAcoD" x1="1" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4B5662"/><stop offset=".5" stop-color="#1A1F25"/><stop offset="1" stop-color="#3A444E"/></linearGradient>
    <symbol id="p7" viewBox="16 2 68 88"><path d="M48.6 8 48.6 62 18 88Z" fill="url(#gCromo)"/><path d="M51.4 8 82 88 51.4 62Z" fill="url(#gAco)"/><path d="M50 4V64" stroke="#fff" stroke-width="1.6"/></symbol>
    <!-- no fundo claro a marca vai em cromo escuro, como manda o manual -->
    <symbol id="p7d" viewBox="16 2 68 88"><path d="M48.6 8 48.6 62 18 88Z" fill="url(#gCromoD)"/><path d="M51.4 8 82 88 51.4 62Z" fill="url(#gAcoD)"/><path d="M50 4V64" stroke="#E9EFF5" stroke-width="1.6"/></symbol>
  </defs>
</svg>

<header id="topo">
  <div class="marca"><svg class="so-escuro"><use href="#p7"/></svg><svg class="so-claro"><use href="#p7d"/></svg><b class="cromo">PANTERA</b><span>GPS · BAURU</span></div>
  <label class="busca placa"><svg class="ic" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 5 5"/></svg><input id="busca" placeholder="Rua, lugar ou coordenada" autocomplete="off"></label>
  <div id="achados" class="placa"></div>
  <div id="chips"></div>
</header>

<div id="manobra" class="placa"></div>
<div id="gps" class="placa" hidden></div>

<nav id="trilho" class="placa">
  <button id="bVolta" aria-label="Fazer a volta" hidden><svg class="ic" viewBox="0 0 24 24"><path d="M4 8h14M14 4l4 4-4 4M20 16H6M10 12l-4 4 4 4"/></svg></button>
  <button id="bNorte" aria-label="Girar o mapa"><svg viewBox="-12 -12 24 24" width="22" height="22"><path d="M0-10 4 0H-4Z" fill="currentColor"/><path d="M0 10 4 0H-4Z" fill="none" stroke="currentColor" stroke-width="1.2"/></svg></button>
  <button id="bMais" aria-label="Aproximar"><svg class="ic" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
  <button id="bMenos" aria-label="Afastar"><svg class="ic" viewBox="0 0 24 24"><path d="M5 12h14"/></svg></button>
  <button id="bEu" aria-label="Minha posição"><svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/><path d="M12 11v2" stroke-width="2.5"/></svg></button>
  <button id="bTema" aria-label="Alternar claro e escuro"><svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 0 16Z" fill="currentColor"/></svg></button>
</nav>

<section id="folha" class="placa"></section>

<script src="cadeado.js"></script>
<script src="dados.js"></script>
<script src="rotas.js"></script>
<script>
'use strict';
const $ = s => document.querySelector(s);
const ler = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } };
const gravar = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };
const G = Rotas.carregar(MAPA);

// ================= tema (as duas versões da identidade BC) =================
const PALETAS = {
  escuro: {
    fundo: '#0D0F12', meta: '#0D0F12',
    rua: ['#1C2126', '#1A1F25', '#20262D', '#2A323B', '#343E49', '#15191E', '#171B20'], borda: [null, '#08090B', '#08090B', '#08090B', '#08090B', null, null],
    evitar: '#8794A2', mao: '#4B5662', rotulo: '#7F8A96', halo: '#0D0F12', lugar: '#C3CCD5', lugarTx: '#DFE5EB',
    faixa: '#AEB9C5', fio: '#FFFFFF', brilho: 'rgba(233,239,245,.6)', brilhoR: 16,
    cromo: [[0, '#FFFFFF'], [0.35, '#D9DEE4'], [0.55, '#8E98A3'], [0.75, '#E6E9ED'], [1, '#A7B0BA']], aco: [[0, '#C3CAD2'], [0.5, '#5E6874'], [1, '#8D97A2']],
    contorno: '#0D0F12', luz: '233,239,245', precisao: 'rgba(135,148,162,', marca: '#E9EFF5',
  },
  claro: {
    fundo: '#EEF1F4', meta: '#EEF1F4',
    rua: ['#DDE3E8', '#FFFFFF', '#FFFFFF', '#F7F9FA', '#F1F4F6', '#F8F9FB', '#E4E9ED'], borda: [null, '#CFD6DD', '#C2CBD4', '#AAB5C0', '#98A4B0', '#DDE2E7', null],
    evitar: '#5D6975', mao: '#9AA6B2', rotulo: '#5D6975', halo: '#EEF1F4', lugar: '#2A323B', lugarTx: '#1A1F25',
    faixa: '#1A1F25', fio: '#E9EFF5', brilho: 'rgba(13,15,18,.28)', brilhoR: 6,
    cromo: [[0, '#6C7886'], [0.44, '#2A323B'], [0.5, '#0F1317'], [0.6, '#4B5662'], [1, '#2A323B']], aco: [[0, '#4B5662'], [0.5, '#1A1F25'], [1, '#3A444E']],
    contorno: '#EEF1F4', luz: '26,31,37', precisao: 'rgba(42,50,59,', marca: '#1A1F25',
  },
};
let tema = new URLSearchParams(location.search).get('tema') === 'claro' ? 'claro' : ler('tema2', 'escuro');
let PAL = PALETAS[tema];
function aplicarTema() {
  PAL = PALETAS[tema];
  document.documentElement.dataset.tema = tema;
  $('meta[name=theme-color]').content = PAL.meta;
  desenhar();
}

// ================= lugares =================
// os destinos não ficam neste arquivo: vêm cifrados (site) e abrem com o PIN
let FIXOS = self.FIXOS || [['Casa', null], ['Casa da sogra', null]];
let meus = ler('lugares', {}), marcas = ler('marcas', []), garupa = ler('garupa', false);
const lugares = () => { const m = new Map(FIXOS); for (const [n, p] of Object.entries(meus)) m.set(n, p); return [...m]; };
let eu = null, rumo = 0, origemManual = null, destino = null, nomeDestino = '', rota = null, navegando = false, seguir = false, salvarComo = null;

// ================= ícones =================
const ICONE = {
  ok: '<path d="M5 12.5 10 17 19 7"/>',
  alerta: '<path d="M12 3 22 20H2Z"/><path d="M12 10v4M12 16.5v1"/>',
  info: '<path d="M12 3 21 12 12 21 3 12Z"/>',
  direita: '<path d="M7 21V12a4 4 0 0 1 4-4h8M15 4l4 4-4 4"/>',
  esquerda: '<path d="M17 21V12a4 4 0 0 0-4-4H5M9 4 5 8l4 4"/>',
  retorno: '<path d="M8 21V9a4 4 0 0 1 8 0v6M12 11l4 4 4-4"/>',
  chegada: '<path d="M12 3 20 11 12 19 4 11Z"/><path d="M12 19v3"/>',
  fora: '<path d="M12 3 22 20H2Z"/><path d="M12 10v4M12 16.5v1"/>',
};
const ic = (n, cls = 'ic') => `<svg class="${cls}" viewBox="0 0 24 24">${ICONE[n]}</svg>`;

// ================= mapa =================
const cv = $('#c'), cx = cv.getContext('2d');
const LAT0 = -22.33, LON0 = -49.06, KY = 111320, KX = KY * Math.cos(LAT0 * Math.PI / 180);
const xy = p => [(p[1] - LON0) * KX, -(p[0] - LAT0) * KY];
const ll = (x, y) => [LAT0 - y / KY, LON0 + x / KX];
const T = G.trechos.map(t => {
  const g = t.g.map(xy), xs = g.map(p => p[0]), ys = g.map(p => p[1]);
  return { g, c: t.c, mao: t.mao, evitar: t.evitar, nome: t.nome, box: [Math.min(...xs), Math.min(...ys), Math.max(...xs), Math.max(...ys)] };
});
const cam = { x: 0, y: 0, z: 0.12, r: 0 };
let W, H, pedido = false;
const desenhar = () => { if (!pedido) { pedido = true; requestAnimationFrame(pintar); } };
function ajustar() { W = innerWidth; H = innerHeight; cv.width = W * devicePixelRatio; cv.height = H * devicePixelRatio; desenhar(); }
const centroY = () => navegando && seguir ? H * 0.68 : H / 2;
function naTela(w) {
  const dx = (w[0] - cam.x) * cam.z, dy = (w[1] - cam.y) * cam.z, c = Math.cos(cam.r), s = Math.sin(cam.r);
  return [W / 2 + dx * c - dy * s, centroY() + dx * s + dy * c];
}
function noMundo(sx, sy) {
  const dx = sx - W / 2, dy = sy - centroY(), c = Math.cos(cam.r), s = Math.sin(cam.r);
  return [cam.x + (dx * c + dy * s) / cam.z, cam.y + (-dx * s + dy * c) / cam.z];
}

  if (!rota) { folha(titulo('Sem caminho até ' + nomeDestino), acoes(['Fechar', limpar])); return; }
  preparar();
  if (silencioso) return desenhar();
  const num = el('div', '', 'num');
  for (const [v, r] of [[km(rota.m), 'Distância'], [rota.min + ' min', 'a 25 km/h'], ['+' + rota.ganho + ' m', 'Subida']]) { const d = el('div'); d.append(el('b', v), el('span', r)); num.append(d); }
  const avisos = [];
  const aviso = (t, tipo) => { const d = el('div', '', 'aviso ' + tipo); d.innerHTML = ic(tipo === 'alerta' ? 'alerta' : tipo === 'ok' ? 'ok' : 'info'); d.append(el('span', t)); avisos.push(d); };
  const ev = Object.entries(rota.evitadas), rp = Object.entries(rota.rapidas);
  if (rota.validada) aviso('Confirmada quadra por quadra no Google: sem contramão (' + new Date(MAPA.validado).toLocaleDateString('pt-BR') + ')', 'ok');
  else aviso('Rota ainda não confirmada quadra por quadra: navegue pelo Google Maps', 'alerta');
  for (const [n, m] of ev) aviso(`Passa ${km(m)} pela ${n}`, 'alerta');
  if (rp.length) aviso(`Vias principais ou acima de 40: ${rp.map(([n, m]) => n + ' (' + km(m) + ')').join(', ')}`, 'alerta');
  if (!ev.length && !rp.length) aviso('Sem avenidas da sua lista no caminho', 'ok');
  for (const s of rota.subidas.slice(0, 3)) aviso(`Subida de ~${s.grau}% na ${s.rua} (${km(s.m)})` + (garupa ? ': talvez precise descer e empurrar' : ''), garupa ? 'alerta' : 'info');
  if (rota.subidas.length > 3) aviso(`Mais ${rota.subidas.length - 3} trechos de subida (pontilhado no mapa)`, 'info');
  if (rota.cargas > 0.45) aviso(rota.cargas > 1 ? 'Não cabe em uma carga' : 'Ida e volta pode não caber em uma carga: confira a bateria', 'alerta');
  if (!rota.validada) for (const [n, m] of Object.entries(rota.duvidas)) aviso(`Mão não confirmada no mapa: ${n} (${km(m)}). Confira a placa`, 'alerta');
  if (!rota.validada) aviso('O Google Maps respeita a mão das ruas; este app só escolhe o caminho longe das avenidas.', 'info');
  if (pico) aviso('Horário de pico: priorizei ruas mais calmas', 'info');
  const leg = el('div', '', 'legenda'); leg.innerHTML = '<span><i></i>Rota</span><span><i class="tr"></i>Avenida evitada</span><span><i class="po"></i>Subida</span>';
  folha(titulo(nomeDestino), num, ...avisos, leg, rota.validada
    ? acoes(['Navegar', comecar, 'pri'], ['Google Maps', abrirGoogle], ['Fazer a volta', inverter], botaoGarupa(), ['Fechar', limpar])
    : acoes(['Navegar pelo Google Maps', abrirGoogle, 'pri'], ['Fazer a volta', inverter], botaoGarupa(), ['Fechar', limpar]));
  enquadrar();
}
// o Google respeita a mão das ruas; as paradas seguram ele no nosso caminho
function abrirGoogle() {
  const l = rota.linha, ac = [0];
  for (let i = 1; i < l.length; i++) ac[i] = ac[i - 1] + Rotas.metros(l[i - 1], l[i]);
  const f = p => p[0].toFixed(6) + ',' + p[1].toFixed(6), para = [];
  for (const q of [0.25, 0.5, 0.75]) { const i = ac.findIndex(a => a >= ac.at(-1) * q); para.push(f(l[i])); }
  const u = 'https://www.google.com/maps/dir/?api=1&travelmode=driving&origin=' + f(l[0]) + '&destination=' + f(l.at(-1)) + '&waypoints=' + encodeURIComponent(para.join('|'));
  const a = document.createElement('a'); a.href = u; a.target = '_blank'; a.rel = 'noopener'; document.body.append(a); a.click(); a.remove();
}
function enquadrar() {
  const p = rota.linha.map(xy), xs = p.map(a => a[0]), ys = p.map(a => a[1]);
  seguir = false;
  const z = Math.min(1.5, (W - 80) / (Math.max(...xs) - Math.min(...xs) + 1), (H * 0.36) / (Math.max(...ys) - Math.min(...ys) + 1));
  voar({ r: 0, z, x: (Math.max(...xs) + Math.min(...xs)) / 2, y: (Math.max(...ys) + Math.min(...ys)) / 2 + (H * 0.1) / z }, 750);
}
function limpar() { volta = false; rota = destino = null; parar(); folha(); desenhar(); }

// ================= navegação =================
let manobras = [], acum = [], trava = null, fora = 0, simulando = null;
const azim = (a, b) => (Math.atan2((b[1] - a[1]) * KX, (b[0] - a[0]) * KY) * 180 / Math.PI + 360) % 360;
function preparar() {
  const l = rota.linha; acum = [0];
  for (let i = 1; i < l.length; i++) acum[i] = acum[i - 1] + Rotas.metros(l[i - 1], l[i]);
  manobras = []; let k = 0;
  const nomes = rota.partes.map(s => G.trechos.find(t => t.g.length === s.g.length && ((t.g[0] === s.g[0]) || (t.g.at(-1) === s.g[0])))?.nome || '');
  for (let i = 0; i < rota.partes.length - 1; i++) {
    k += rota.partes[i].g.length - 1;
    if (!l[k - 1] || !l[k + 1]) continue;
    const g = ((azim(l[k], l[k + 1]) - azim(l[k - 1], l[k]) + 540) % 360) - 180;
    if (Math.abs(g) < 35) continue;
    const mudouRua = nomes[i + 1] && nomes[i] !== nomes[i + 1];
    const lado = g > 0 ? 'direita' : 'esquerda', retorno = Math.abs(g) > 140;
    manobras.push({ s: acum[k], icone: retorno ? 'retorno' : lado, acao: (retorno ? 'Retorne pela ' : 'Vire à ') + lado, rua: mudouRua ? nomes[i + 1] : '' });
  }
  manobras.push({ s: acum.at(-1), icone: 'chegada', acao: 'Chegada', rua: nomeDestino });
}
function placaManobra(icone, grande, pequeno, foraDaRota) {
  const m = $('#manobra'); m.classList.toggle('aviso-fora', !!foraDaRota);
  m.innerHTML = `<div class="seta">${ic(icone, '')}</div><div><b></b><span></span></div>`;
  m.querySelector('.seta svg').setAttribute('class', 'ic');
  m.querySelector('b').textContent = grande; m.querySelector('span').textContent = pequeno;
}
function andou(p) {
  if (!navegando || !rota) return;
  let melhor = 1e9, onde = 0;
  for (let i = 1; i < rota.linha.length; i++) {
    const d = Rotas.distSeg(p, rota.linha[i - 1], rota.linha[i]);
    if (d < melhor) { melhor = d; onde = acum[i - 1] + Math.min(Rotas.metros(rota.linha[i - 1], p), acum[i] - acum[i - 1]); }
  }
  fora = melhor > 40 ? fora + 1 : 0;
  if (fora >= 3) { fora = 0; if (rota.validada) { placaManobra('fora', 'Fora da rota', 'Volte pro fio da rota ou abra no Google Maps', true); return; } calcular(true); return; }
  const falta = acum.at(-1) - onde;
  if (falta < 25) { placaManobra('chegada', 'Chegou', nomeDestino); return; }
  const m = manobras.find(m => m.s > onde + 5) || manobras.at(-1);
  placaManobra(m.icone, km(m.s - onde), m.acao + (m.rua ? (m.icone === 'chegada' ? ': ' : ' na ') + m.rua : ''));
  folha(titulo(`${km(falta)} · ${Math.max(1, Math.round(falta / 1000 / 25 * 60))} min`), el('p', 'até ' + nomeDestino, 'sub'),
    acoes(['Parar', () => { parar(); calcular(); }], ['Buraco aqui', () => marcar2('buraco')], ['Interditado', () => marcar2('interditado')], ['Contramão aqui', () => marcar2('contramao')]));
}
function marcar2(tipo) {
  const a = (rumo * Math.PI) / 180, d = tipo === 'interditado' ? 25 : 0;
  marcas.push({ tipo, rumo, p: [eu[0] + d * Math.cos(a) / KY, eu[1] + d * Math.sin(a) / KX] }); gravar('marcas', marcas);
  if (tipo !== 'buraco') calcular(true);
  desenhar();
}
async function comecar() {
  parado(); navegando = true; seguir = true; fora = 0; if (modo === 'livre') modo = 'norte'; document.body.classList.add('nav'); cam.z = 1.4;
  try { trava = await navigator.wakeLock.request('screen'); } catch {}
  if (new URLSearchParams(location.search).has('sim')) simular(); else ligarGps();
  posicao(eu || rota.linha[0], azim(rota.linha[0], rota.linha[1] || rota.linha[0]));
}
function parar() { navegando = false; cam.r = 0; document.body.classList.remove('nav'); trava?.release().catch(() => {}); trava = null; clearInterval(simulando); }
document.addEventListener('visibilitychange', async () => { if (navegando && document.visibilityState === 'visible') try { trava = await navigator.wakeLock.request('screen'); } catch {} });
function simular() {
  let s = 0; clearInterval(simulando);
  simulando = setInterval(() => {
    s += 12; const i = acum.findIndex(a => a >= s); if (i < 1) return clearInterval(simulando);
    const a = rota.linha[i - 1], b = rota.linha[i], f = (s - acum[i - 1]) / (acum[i] - acum[i - 1] || 1);
    posicao([a[0] + (b[0] - a[0]) * f, a[1] + (b[1] - a[1]) * f], azim(a, b));
  }, 400);
}

// ================= GPS =================
let vigia = null, ultima = null, precisao = 0, modo = ler('modo', 'norte'), visto = null, rumoVisto = 0, deslize = 0;
// a seta desliza de um ponto do GPS ao outro (e a câmera vai junto)
function posicao(p, direcao) {
  const de = visto || p, rDe = rumoVisto;
  eu = p;
  if (direcao != null && !Number.isNaN(direcao)) rumo = direcao;
  const dr = ((rumo - rDe + 540) % 360) - 180, t0 = performance.now(), ms = navegando ? 900 : 350, id = ++deslize;
  const passo = t => {
    if (id !== deslize) return;
    const k = Math.min(1, (t - t0) / ms), e = 1 - Math.pow(1 - k, 2);
    visto = [de[0] + (p[0] - de[0]) * e, de[1] + (p[1] - de[1]) * e]; rumoVisto = rDe + dr * e;
    if (seguir) { [cam.x, cam.y] = xy(visto); if (modo === 'direcao') cam.r = -rumoVisto * Math.PI / 180; }
    desenhar(); if (k < 1) requestAnimationFrame(passo);
  };
  requestAnimationFrame(passo);
  andou(p);
}
function ligarGps() {
  if (vigia != null || !navigator.geolocation) return;
  vigia = navigator.geolocation.watchPosition(g => {
    const p = [g.coords.latitude, g.coords.longitude], primeira = !eu;
    if (g.coords.accuracy > 60 && eu && precisao <= 60) return; // posição ruim não substitui uma boa
    precisao = Math.round(g.coords.accuracy);
    const ind = $('#gps'); ind.hidden = false; ind.className = 'placa' + (precisao <= 30 ? '' : ' ruim');
    ind.innerHTML = '<i></i>'; ind.append(precisao <= 30 ? 'GPS ±' + precisao + ' M' : 'GPS FRACO ±' + precisao + ' M');
    let d = g.coords.speed > 1 ? g.coords.heading : null;
    if (d == null && ultima && Rotas.metros(ultima, p) > 8) d = azim(ultima, p);
    if (!ultima || Rotas.metros(ultima, p) > 8) ultima = p;
    posicao(p, d);
    if (destino && !navegando && precisao <= 60 && (!rota || Rotas.metros(p, rota.linha[0]) > 80)) calcular();
    else if (primeira && destino && !rota) calcular();
    else if (primeira && !destino) { const [x, y] = xy(p); voar({ x, y, z: 0.6 }, 800); }
  }, erro => { desligarGps(); folha(titulo('Sem GPS aqui'), el('p', erro.code === 1 ? 'A localização foi negada ou está bloqueada. Toque no mapa e escolha "Sair daqui".' : 'Não consegui sua posição agora.', 'sub'), acoes(['Fechar', () => folha()])); }, { enableHighAccuracy: true, maximumAge: 1000, timeout: 20000 });
}
function desligarGps() { if (vigia != null) navigator.geolocation.clearWatch(vigia); vigia = null; }

addEventListener('resize', ajustar);
aplicarTema(); chips(); ajustar();
document.fonts?.ready.then(desenhar);

// ================= cadeado (só na versão do site) =================
async function abrirCadeado(senha) {
  const C = self.CADEADO, b = t => Uint8Array.from(atob(t), c => c.charCodeAt(0));
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(senha), 'PBKDF2', false, ['deriveKey']);
  const k = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b(C.sal), iterations: C.n, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b(C.iv) }, k, b(C.dados))));
}
if (self.CADEADO) {
  const guardado = ler('cofre', null);
  if (guardado && guardado.iv === self.CADEADO.iv) { FIXOS = guardado.lugares; chips(); }
  else {
    const d = el('div'); d.id = 'cadeado';
    d.innerHTML = '<svg class="simb so-escuro"><use href="#p7"/></svg><svg class="simb so-claro"><use href="#p7d"/></svg><div class="nome"><b class="cromo">PANTERA</b><span>GPS · Bauru</span></div>';
    let pin = '';
    const pontos = el('div', '', 'pontos'), msg = el('p'), tecl = el('div', '', 'tecl');
    const mostrar = () => pontos.replaceChildren(...[0, 1, 2, 3].map(i => el('i', '', i < pin.length ? 'on' : '')));
    const tentar = async () => {
      msg.textContent = 'Abrindo';
      try { FIXOS = await abrirCadeado(pin); gravar('cofre', { iv: self.CADEADO.iv, lugares: FIXOS }); chips(); d.classList.add('sai'); setTimeout(() => d.remove(), 420); }
      catch { msg.textContent = 'Senha errada'; pin = ''; mostrar(); }
    };
    for (const k of ['1', '2', '3', '4', '5', '6', '7', '8', '9', '', '0', 'apaga']) {
      const b = el('button', k === 'apaga' ? '' : k, k ? (k === 'apaga' ? 'apaga' : '') : 'sem');
      if (k === 'apaga') { b.innerHTML = '<svg class="ic" viewBox="0 0 24 24"><path d="M9 5h11v14H9l-6-7Z"/><path d="m12 9 5 6M17 9l-5 6"/></svg>'; b.setAttribute('aria-label', 'Apagar'); }
      b.onclick = () => { if (k === 'apaga') pin = pin.slice(0, -1); else if (pin.length < 8) pin += k; mostrar(); msg.textContent = ''; if (pin.length === 4) tentar(); };
      tecl.append(b);
    }
    mostrar();
    d.append(pontos, tecl, msg); document.body.append(d);
  }
}
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js');
